name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fails fast with a precise message instead of Wrangler's generic "Authentication error".
      - name: Verify Cloudflare credentials
        run: |
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is empty or missing."; exit 1
          fi
          # User tokens and Account API tokens verify at different endpoints.
          status=$(api /user/tokens/verify | jq -r '.result.status // empty')
          [ "$status" = "active" ] || status=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | jq -r '.result.status // empty')
          if [ "$status" != "active" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is invalid, expired or pasted with extra characters."; exit 1
          fi
          missing=""
          for check in "d1/database:D1 Edit" "workers/scripts:Workers Scripts Edit" "r2/buckets:Workers R2 Storage Edit"; do
            path=${check%%:*}; perm=${check#*:}
            [ "$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/$path" | jq -r '.success')" = "true" ] || missing="$missing, $perm"
          done
          missing=${missing#, }
          if [ "$missing" = "D1 Edit, Workers Scripts Edit, Workers R2 Storage Edit" ]; then
            echo "::error::Token works but cannot reach this account at all: CLOUDFLARE_ACCOUNT_ID is wrong, or the token's Account Resources do not include it."; exit 1
          elif [ -n "$missing" ]; then
            echo "::error::Token is missing these permissions for this account: $missing"; exit 1
          fi
          echo "Cloudflare token and account OK"

      # Creates the D1 database on the first run and injects its id into wrangler.jsonc.
      - name: Ensure D1 database
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="med-vault") | .uuid')
          if [ -z "$ID" ]; then
            npx wrangler d1 create med-vault
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="med-vault") | .uuid')
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc
          echo "D1 database id: $ID"

      # R2 must be enabled once in the Cloudflare dashboard (needs a payment method; free tier is $0).
      - name: Ensure R2 bucket
        run: |
          if ! npx wrangler r2 bucket list | grep -q "med-vault-files"; then
            npx wrangler r2 bucket create med-vault-files
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply med-vault --remote

      - name: Build and deploy
        run: npm run build && npx wrangler deploy
