name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Creates the D1 database on the first run and injects its id into wrangler.jsonc.
      - name: Ensure D1 database
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="med-vault") | .uuid')
          if [ -z "$ID" ]; then
            npx wrangler d1 create med-vault
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="med-vault") | .uuid')
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc
          echo "D1 database id: $ID"

      # R2 must be enabled once in the Cloudflare dashboard (needs a payment method; free tier is $0).
      - name: Ensure R2 bucket
        run: |
          if ! npx wrangler r2 bucket list | grep -q "med-vault-files"; then
            npx wrangler r2 bucket create med-vault-files
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply med-vault --remote

      - name: Build and deploy
        run: npm run build && npx wrangler deploy

      - name: Set APP_PASSWORD
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -n "$APP_PASSWORD" ]; then
            echo "$APP_PASSWORD" | npx wrangler secret put APP_PASSWORD
          else
            echo "::warning::APP_PASSWORD GitHub secret is not set; login will fail until it is."
          fi
